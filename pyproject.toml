[project]
name = "research-memo-team"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.7.6,<2",
    "langchain-openai>=1.7.4,<2",
    "langgraph>=1.2.20,<2",
    "mcp>=1.9,<2",
    "pydantic>=2.14.3,<3",
    "python-dotenv>=1.2.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
